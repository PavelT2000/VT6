services:
  db:
    image: mysql:8.0
    container_name: lab6-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-lab6_auth}
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: lab6-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}
      DB_NAME: ${DB_NAME:-lab6_auth}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    volumes:
      - uploads_data:/app/uploads
      - ./users.txt:/app/users.txt:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:
